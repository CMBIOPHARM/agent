# Agent 03 매일 업무일지 요약·점검 설정. scripts/daily_worklog/run_daily_worklog.sh가 읽는다.
# MODE=live   : v0 초안을 Drive(DRAFT_DIR/YYYY-MM-DD주)에 저장한다.
# MODE=shadow : 결과를 Mac 로컬에만 만든다. 스크립트 시험용이다.
MODE=live
MODEL=claude-sonnet-5-5
# 상대 경로는 Drive 마운트(~/Library/CloudStorage/GoogleDrive-jpark@cmbiopharm.com) 기준이다.
# RAW_DIR   : 직원 업무일지 원본(읽기 전용)
# DRAFT_DIR : v0 초안. 대표 전용(내 드라이브). 주 폴더 이름은 그 주 월요일 날짜(YYYY-MM-DD주)다.
# SHARE_DIR : 대표가 검토·수정을 지시한 v1 이상만 둔다(publish_summary.py --release). 자동 실행은 여기에 쓰지 않는다.
RAW_DIR="공유 드라이브/CMBIOPHARM/업무일지"
DRAFT_DIR="내 드라이브/09. 인사/01. 차주업무지시"
SHARE_DIR="공유 드라이브/CMBIOPHARM/업무일지"
# 주간 정리(scripts/weekly_review): 일요일 10:00, v0 Word를 DRAFT_DIR/<차주 월요일>주에 저장
WEEKLY_MODEL=claude-opus-5-5
# RND_DIR를 비우면 이 저장소 옆의 rnd 기본 저장소(~/orca/rnd)를 읽는다.
RND_DIR=""
# KAKAO_DIR: 대표가 매주 넣는 사내 카톡 백업(.txt/.csv/.zip, 읽기 전용). 지난주 월~일 대화에서 이행 지시를 뽑아 v0에 넣는다.
KAKAO_DIR="내 드라이브/09. 인사/01. 차주업무지시/사내 카톡 백업"
